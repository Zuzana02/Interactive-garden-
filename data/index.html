<!DOCTYPE html>
<html>
<head>
    <title>LOOMIA STUDIO - Interactive Canvas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        body { 
            margin: 0; padding: 0; background: #000; height: 100vh; width: 100vw; 
            overflow: hidden; touch-action: none; -webkit-touch-callout: none; 
            -webkit-user-select: none; user-select: none;
        }

        /* The grid layout */
        .grid { 
            display: grid; grid-template-columns: repeat(42, 1fr); grid-template-rows: repeat(7, 1fr);    
            gap: 2px; width: 100%; height: 100%; padding: 4px; box-sizing: border-box; 
            position: relative; z-index: 10;
        }

        /* LEDs are pure black by default */
        .led { 
            background: #000; 
            border-radius: 4px;
            cursor: pointer; user-drag: none; -webkit-user-drag: none;
            /* Slow fade out transition to black */
            transition: background 1.5s ease-out, box-shadow 1.5s ease-out;
        }

        /* State when finger draws over the LED grid cell */
        .led.on { 
            /* Soft, warm bone color instead of harsh pure white */
            background: #F9F6F0; 
            box-shadow: 0 0 20px 8px rgba(249, 246, 240, 0.4); 
            /* Instant activation */
            transition: background 0s, box-shadow 0s;
        }
    </style>
</head>
<body>
    
    <div class="grid" id="canvas"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const numLeds = 294;
        
        let isDrawing = false;
        let hasDragged = false;
        let startElement = null; 
        let lastDraggedId = null; 

        // Initialize the black interactive grid
        for (let i = 0; i < numLeds; i++) {
            const div = document.createElement('div');
            div.className = 'led';
            div.dataset.id = i;
            canvas.appendChild(div);
        }

        // --- MOUSE CONTROLS ---
        canvas.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('led')) {
                isDrawing = true;
                hasDragged = false;
                startElement = e.target;
            }
            e.preventDefault();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing && e.target.classList.contains('led')) {
                hasDragged = true;
                activateLed(e.target, 1); 
            }
        });

        window.addEventListener('mouseup', () => {
            if (isDrawing && !hasDragged && startElement) {
                activateLed(startElement, 2); 
            }
            isDrawing = false;
            startElement = null;
            lastDraggedId = null; 
        });

        // --- TOUCH CONTROLS ---
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            if (element && element.classList.contains('led')) {
                isDrawing = true;
                hasDragged = false;
                startElement = element;
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            e.preventDefault();
            hasDragged = true;
            const touch = e.touches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            activateLed(element, 1); 
        }, { passive: false });

        window.addEventListener('touchend', () => {
            if (isDrawing && !hasDragged && startElement) {
                activateLed(startElement, 2); 
            }
            isDrawing = false;
            startElement = null;
            lastDraggedId = null; 
        });

        // --- DATA TRANSMISSION ---
        function activateLed(element, state) {
            if (element && element.classList.contains('led')) {
                const id = element.dataset.id;
                
                if (state === 1 && id === lastDraggedId) return;
                if (state === 1) lastDraggedId = id;

                // Visually ignite the grid cell instantly
                element.classList.add('on'); 
                
                // Transmit code to the ESP32
                fetch(`/set?id=${id}&state=${state}`).catch(err => console.error(err));
                
                // Immediately clear class to initiate CSS transition fade out
                setTimeout(() => { element.classList.remove('on'); }, 50); 
            }
        }
    </script>
</body>
</html>
