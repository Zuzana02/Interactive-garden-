<!DOCTYPE html>
<html>
<head>
    <title>Garden Canvas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #111; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            touch-action: none; 
            -webkit-touch-callout: none;
            -webkit-user-select: none; 
            user-select: none;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(11, 1fr); 
            grid-template-rows: repeat(4, 1fr);    
            gap: 8px;                              
            width: 100%; 
            height: 100%; 
            padding: 8px;                          
            box-sizing: border-box; 
        }

        .led { 
            background: #222; 
            border-radius: 8px; 
            cursor: pointer;
            user-drag: none;
            -webkit-user-drag: none;
            /* 1.5 sekundový pomalý fade-out do tmy */
            transition: background 1.5s ease-out, box-shadow 1.5s ease-out;
        }

        .led.on { 
            background: #fff; 
            box-shadow: 0 0 20px rgba(255, 255, 255, 1); 
            /* Okamžité rozsvietenie (žiadne čakanie) */
            transition: background 0s, box-shadow 0s;
        }
    </style>
</head>
<body>
    <div class="grid" id="canvas"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const numLeds = 44;
        let isDrawing = false;

        for (let i = 0; i < numLeds; i++) {
            const div = document.createElement('div');
            div.className = 'led';
            div.dataset.id = i;
            
            div.addEventListener('mousedown', (e) => { isDrawing = true; activateLed(div); e.preventDefault(); });
            div.addEventListener('mouseenter', () => { if (isDrawing) activateLed(div); });
            canvas.appendChild(div);
        }

        document.addEventListener('mouseup', () => isDrawing = false);
        document.addEventListener('mouseleave', () => isDrawing = false);

        document.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouch(e); }, { passive: false });
        document.addEventListener('touchmove', (e) => { e.preventDefault(); handleTouch(e); }, { passive: false });

        function handleTouch(e) {
            const touch = e.touches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            activateLed(element);
        }

        function activateLed(element) {
            if (element && element.classList.contains('led') && !element.classList.contains('on')) {
                const id = element.dataset.id;
                
                element.classList.add('on'); 
                fetch(`/set?id=${id}&state=1`).catch(err => console.error(err));
                
                // Zoberieme triedu 'on' preč takmer okamžite (po 50ms). 
                // Tým sa spustí tá 1.5-sekundová CSS fade-out animácia!
                setTimeout(() => {
                    element.classList.remove('on');
                }, 50); 
            }
        }
    </script>
</body>
</html>
